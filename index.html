<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>2048</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#1A1A2E;--surface:#16213E;--card:#0F3460;
  --txt:#F0F0FF;--txt2:#9090C0;
  --gold:#D4A843;--green:#1DB87A;--purple:#6C47FF;
  --r:12px;
  --grid-bg:#2A2A4A;--cell-bg:#1E1E3A;
}
.light{
  --bg:#F5F5F0;--surface:#FFFFFF;--card:#EDECEA;
  --txt:#1A1A1A;--txt2:#776E65;
  --grid-bg:#BBADA0;--cell-bg:#CDC1B4;
}
html,body{height:100%;width:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:100vh;transition:background 0.3s,color 0.3s;overflow-y:auto;padding:0 0 20px}

/* HEADER */
.header{width:100%;max-width:480px;padding:16px 16px 0;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:28px;font-weight:900;color:var(--gold);letter-spacing:-0.03em;line-height:1}
.logo span{font-size:11px;font-weight:500;color:var(--txt2);display:block;letter-spacing:0.05em;margin-top:2px}
.header-right{display:flex;gap:8px;align-items:center}
.icon-btn{width:36px;height:36px;border-radius:10px;background:var(--surface);border:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:0.18s;color:var(--txt)}
.light .icon-btn{border:1px solid rgba(0,0,0,0.1)}
.icon-btn:hover{transform:scale(1.08)}
.icon-btn:active{transform:scale(0.95)}

/* SCORES */
.scores{width:100%;max-width:480px;padding:12px 16px;display:flex;gap:10px}
.score-box{flex:1;background:var(--surface);border-radius:var(--r);padding:10px 12px;text-align:center;border:1px solid rgba(255,255,255,0.06)}
.light .score-box{border:1px solid rgba(0,0,0,0.08)}
.score-label{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--txt2);margin-bottom:4px}
.score-val{font-size:20px;font-weight:900;color:var(--txt);line-height:1;transition:transform 0.15s}
.score-val.bump{transform:scale(1.2)}

/* CONTROLS */
.controls{width:100%;max-width:480px;padding:0 16px 12px;display:flex;gap:8px}
.btn{flex:1;padding:10px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;border:none;transition:0.18s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(0.97)}
.btn-new{background:var(--gold);color:#111}
.btn-new:hover{background:#E5B94A}

/* GRID */
.grid-wrap{width:100%;max-width:480px;padding:0 16px}
.grid-container{background:var(--grid-bg);border-radius:var(--r);padding:8px;position:relative;transition:background 0.3s}
.grid-cells{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid-cell{background:var(--cell-bg);border-radius:8px;aspect-ratio:1;transition:background 0.3s}

/* TILES */
.tiles-layer{position:absolute;top:8px;left:8px;right:8px;bottom:8px;pointer-events:none}
.tile{position:absolute;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;transition:top 0.12s ease,left 0.12s ease;z-index:2}
.tile.new{animation:popIn 0.18s ease forwards}
.tile.merge{animation:popMerge 0.2s ease forwards}
@keyframes popIn{0%{transform:scale(0)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes popMerge{0%{transform:scale(1)}40%{transform:scale(1.2)}100%{transform:scale(1)}}

/* Tile colors — dark mode */
.t2{background:#2E2E5E;color:#F0F0FF}
.t4{background:#3A2E6E;color:#F0F0FF}
.t8{background:#E8552A;color:#fff}
.t16{background:#E64A1F;color:#fff}
.t32{background:#E84B6A;color:#fff}
.t64{background:#C0392B;color:#fff}
.t128{background:#D4A843;color:#fff;font-size:clamp(14px,3.5vw,22px)}
.t256{background:#E5B94A;color:#fff;font-size:clamp(13px,3vw,20px)}
.t512{background:#1DB87A;color:#fff;font-size:clamp(12px,2.8vw,19px)}
.t1024{background:#16A064;color:#fff;font-size:clamp(10px,2.5vw,16px)}
.t2048{background:#6C47FF;color:#fff;font-size:clamp(9px,2.2vw,15px)}
.t4096{background:#9333EA;color:#fff;font-size:clamp(8px,2vw,13px)}

/* Light mode tile overrides */
.light .t2{background:#EEE4DA;color:#776E65}
.light .t4{background:#EDE0C8;color:#776E65}
.light .t8{background:#F2B179;color:#fff}
.light .t16{background:#F59563;color:#fff}
.light .t32{background:#F67C5F;color:#fff}
.light .t64{background:#F65E3B;color:#fff}
.light .t128{background:#EDCF72;color:#fff}
.light .t256{background:#EDCC61;color:#fff}
.light .t512{background:#EDC850;color:#fff}
.light .t1024{background:#EDC53F;color:#fff}
.light .t2048{background:#EDC22E;color:#fff}
.light .t4096{background:#3C3A32;color:#fff}

/* MESSAGE OVERLAY */
.overlay{position:absolute;inset:0;border-radius:var(--r);background:rgba(0,0,0,0.72);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;opacity:0;pointer-events:none;transition:opacity 0.3s;gap:12px}
.overlay.show{opacity:1;pointer-events:all}
.overlay-title{font-size:28px;font-weight:900;color:#fff}
.overlay-sub{font-size:14px;color:rgba(255,255,255,0.6)}
.overlay .btn-new{padding:12px 28px;border-radius:10px;font-size:15px;flex:none;width:160px}

/* HOW TO PLAY */
.how{width:100%;max-width:480px;padding:12px 16px 0;display:flex;gap:8px}
.how-item{flex:1;background:var(--surface);border-radius:10px;padding:10px 8px;text-align:center;border:1px solid rgba(255,255,255,0.06)}
.light .how-item{border:1px solid rgba(0,0,0,0.08)}
.how-icon{font-size:18px;margin-bottom:4px}
.how-txt{font-size:10px;color:var(--txt2);line-height:1.4;font-weight:500}

/* SHARE / COFFEE */
.bottom-actions{width:100%;max-width:480px;padding:14px 16px 0;display:flex;gap:10px}
.btn-share{background:var(--purple);color:#fff}
.btn-share:hover{background:#5535E0}
.btn-coffee{background:#FFDD00;color:#000}
.btn-coffee:hover{background:#FFE633}

/* BEST SCORE BADGE */
.best-badge{font-size:10px;color:var(--gold);font-weight:700;margin-top:2px}

/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--txt);color:var(--bg);padding:10px 20px;border-radius:100px;font-size:13px;font-weight:700;opacity:0;transition:all 0.25s;pointer-events:none;z-index:999;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* WIN CONFETTI */
.conf{position:fixed;pointer-events:none;z-index:9999;width:8px;height:8px;border-radius:2px;animation:confFall linear forwards}
@keyframes confFall{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

@media(min-width:481px){
  body{padding-top:20px}
  .header{padding-top:20px}
}
@media(max-width:360px){
  .logo{font-size:24px}
  .score-val{font-size:17px}
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">2048</div>
  <div class="header-right">
    <div class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle theme">🌙</div>
  </div>
</div>

<!-- SCORES -->
<div class="scores">
  <div class="score-box">
    <div class="score-label">Score</div>
    <div class="score-val" id="score">0</div>
  </div>
  <div class="score-box">
    <div class="score-label">Best</div>
    <div class="score-val" id="best">0</div>
    <div class="best-badge" id="bestBadge"></div>
  </div>
  <div class="score-box">
    <div class="score-label">Moves</div>
    <div class="score-val" id="moves">0</div>
  </div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <button class="btn btn-new" onclick="newGame()">🔄 New Game</button>
</div>

<!-- GRID -->
<div class="grid-wrap">
  <div class="grid-container" id="grid">
    <div class="grid-cells" id="bgCells"></div>
    <div class="tiles-layer" id="tilesLayer"></div>
    <div class="overlay" id="overlay">
      <div class="overlay-title" id="overlayTitle"></div>
      <div class="overlay-sub" id="overlaySub"></div>
      <button class="btn btn-new" onclick="newGame()">Play Again</button>
    </div>
  </div>
</div>

<!-- HOW TO PLAY -->
<div class="how">
  <div class="how-item"><div class="how-icon">👆</div><div class="how-txt">Swipe to move tiles</div></div>
  <div class="how-item"><div class="how-icon">🔢</div><div class="how-txt">Same numbers merge</div></div>
  <div class="how-item"><div class="how-icon">🏆</div><div class="how-txt">Reach 2048 to win</div></div>
</div>

<!-- SHARE + COFFEE -->
<div class="bottom-actions">
  <button class="btn btn-share" onclick="shareGame()">🔗 Share</button>
  <button class="btn btn-coffee" onclick="buyCoffee()">☕ Buy Me a Coffee</button>
</div>

<div id="toast"></div>

<script>
// ── STATE ──────────────────────────────────────────────────────────
const SIZE = 4;
let board = [], score = 0, best = 0, moveCount = 0;
let prevBoard = [], prevScore = 0, prevMoves = 0;
let won = false, over = false;
let tileSize = 0, tileGap = 8;
let isLight = false;

// ── INIT ───────────────────────────────────────────────────────────
function init(){
  best = parseInt(localStorage.getItem('2048_best')||'0');
  isLight = localStorage.getItem('2048_theme')==='light';
  if(isLight)document.body.classList.add('light');
  updateThemeBtn();
  buildBgCells();
  newGame();
  setupSwipe();
  document.addEventListener('keydown', handleKey);
}

function buildBgCells(){
  const bg = document.getElementById('bgCells');
  bg.innerHTML = '';
  for(let i=0;i<16;i++){const c=document.createElement('div');c.className='grid-cell';bg.appendChild(c);}
}

function newGame(){
  board = Array.from({length:SIZE},()=>Array(SIZE).fill(0));
  score = 0; moveCount = 0; won = false; over = false;
  prevBoard=[]; prevScore=0; prevMoves=0;
  hideOverlay();
  addRandom(); addRandom();
  render();
}

// ── BOARD LOGIC ────────────────────────────────────────────────────
function addRandom(){
  const empty=[];
  board.forEach((row,r)=>row.forEach((v,c)=>{if(!v)empty.push([r,c])}));
  if(!empty.length)return;
  const [r,c]=empty[Math.floor(Math.random()*empty.length)];
  board[r][c]=Math.random()<0.9?2:4;
  return [r,c];
}

function cloneBoard(b){return b.map(r=>[...r])}

function slide(row){
  let arr=row.filter(v=>v);
  for(let i=0;i<arr.length-1;i++){
    if(arr[i]===arr[i+1]){
      arr[i]*=2; score+=arr[i];
      if(arr[i]===2048&&!won){won=true;}
      const curMax=Math.max(...board.flat());
      if(arr[i]>=curMax){confetti(14);}
      arr.splice(i+1,1); i++;
    }
  }
  while(arr.length<SIZE)arr.push(0);
  return arr;
}

function move(dir){
  if(over)return;
  prevBoard=cloneBoard(board);prevScore=score;prevMoves=moveCount;
  let moved=false;
  const b=cloneBoard(board);

  if(dir==='left'||dir==='right'){
    for(let r=0;r<SIZE;r++){
      let row=board[r];
      if(dir==='right')row=[...row].reverse();
      const s=slide(row);
      if(dir==='right')s.reverse();
      if(s.join()!==b[r].join())moved=true;
      board[r]=s;
    }
  } else {
    for(let c=0;c<SIZE;c++){
      let col=board.map(r=>r[c]);
      if(dir==='down')col=[...col].reverse();
      const s=slide(col);
      if(dir==='down')s.reverse();
      s.forEach((v,r)=>{if(v!==b[r][c])moved=true;board[r][c]=v;});
    }
  }

  if(!moved){score=prevScore;return;}
  moveCount++;
  if(score>best){best=score;localStorage.setItem('2048_best',best);}
  const added=addRandom();
  render(added);
  updateScores();

  if(won&&!over){
    over=true;
    setTimeout(()=>{
      showOverlay('🏆 You Win!','You reached 2048! Keep going for a high score.');
      confetti(60);
    },350);
  } else if(isGameOver()){
    over=true;
    setTimeout(()=>showOverlay('Game Over','No more moves. Try again!'),350);
  }
}

function isGameOver(){
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    if(!board[r][c])return false;
    if(c<SIZE-1&&board[r][c]===board[r][c+1])return false;
    if(r<SIZE-1&&board[r][c]===board[r+1][c])return false;
  }
  return true;
}

function undo(){
  if(!prevBoard.length)return;
  board=cloneBoard(prevBoard);score=prevScore;moveCount=prevMoves;
  prevBoard=[];won=false;over=false;hideOverlay();
  render();updateScores();
  toast('Undone ↩');
}

// ── RENDER ─────────────────────────────────────────────────────────
function calcTileSize(){
  const wrap=document.getElementById('grid');
  const w=wrap.offsetWidth-16; // minus padding*2
  tileSize=(w-(tileGap*(SIZE+1)))/SIZE;
  return tileSize;
}

function render(newPos){
  calcTileSize();
  const layer=document.getElementById('tilesLayer');
  layer.innerHTML='';
  board.forEach((row,r)=>{
    row.forEach((val,c)=>{
      if(!val)return;
      const tile=document.createElement('div');
      tile.className=`tile t${Math.min(val,4096)}`;
      const top=r*(tileSize+tileGap);
      const left=c*(tileSize+tileGap);
      tile.style.cssText=`top:${top}px;left:${left}px;width:${tileSize}px;height:${tileSize}px;font-size:${tileFontSize(val)}px`;
      tile.textContent=val;
      if(newPos&&newPos[0]===r&&newPos[1]===c)tile.classList.add('new');
      layer.appendChild(tile);
    });
  });
  // Update grid height
  const h=SIZE*(tileSize+tileGap)+tileGap;
  document.getElementById('tilesLayer').style.height=h+'px';
  document.querySelector('.grid-cells').style.minHeight=h+'px';
}

function tileFontSize(v){
  const s=tileSize||70;
  if(v<100)return Math.min(s*0.42,28);
  if(v<1000)return Math.min(s*0.36,24);
  if(v<10000)return Math.min(s*0.30,20);
  return Math.min(s*0.24,16);
}

function updateScores(){
  const scoreEl=document.getElementById('score');
  const bestEl=document.getElementById('best');
  const movesEl=document.getElementById('moves');
  scoreEl.textContent=score.toLocaleString();
  bestEl.textContent=best.toLocaleString();
  movesEl.textContent=moveCount;
  scoreEl.classList.add('bump');setTimeout(()=>scoreEl.classList.remove('bump'),200);
  if(score>=best&&score>0)document.getElementById('bestBadge').textContent='🏆 Personal Best';
  else document.getElementById('bestBadge').textContent='';
}

// ── OVERLAY ────────────────────────────────────────────────────────
function showOverlay(title,sub){
  document.getElementById('overlayTitle').textContent=title;
  document.getElementById('overlaySub').textContent=sub;
  document.getElementById('overlay').classList.add('show');
}
function hideOverlay(){document.getElementById('overlay').classList.remove('show');}

// ── INPUT ──────────────────────────────────────────────────────────
function handleKey(e){
  const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
  if(map[e.key]){e.preventDefault();move(map[e.key]);}
}

function setupSwipe(){
  const grid=document.getElementById('grid');
  let sx=0,sy=0,moved=false;
  grid.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;moved=false;},{passive:true});
  grid.addEventListener('touchmove',e=>{e.preventDefault();},{passive:false});
  grid.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-sx;
    const dy=e.changedTouches[0].clientY-sy;
    const absDx=Math.abs(dx),absDy=Math.abs(dy);
    if(Math.max(absDx,absDy)<20)return;
    if(absDx>absDy)move(dx>0?'right':'left');
    else move(dy>0?'down':'up');
  },{passive:true});
}

// ── THEME ──────────────────────────────────────────────────────────
function toggleTheme(){
  isLight=!isLight;
  document.body.classList.toggle('light',isLight);
  localStorage.setItem('2048_theme',isLight?'light':'dark');
  updateThemeBtn();
}
function updateThemeBtn(){
  document.getElementById('themeBtn').textContent=isLight?'🌙':'☀️';
}

// ── SHARE ──────────────────────────────────────────────────────────
function shareGame(){
  const highest=Math.max(...board.flat());
  const text=`🎮 I just scored ${score.toLocaleString()} in 2048 and reached the ${highest} tile!\n\nPlay free at: https://palmergeorge51-art.github.io/2048`;
  if(navigator.share){
    navigator.share({title:'2048',text,url:'https://palmergeorge51-art.github.io/2048'}).catch(()=>{});
  } else {
    navigator.clipboard.writeText(text).then(()=>toast('Caption copied! Paste anywhere 🔗')).catch(()=>toast('Score: '+score.toLocaleString()));
  }
}

// ── COFFEE ─────────────────────────────────────────────────────────
function buyCoffee(){
  window.open('https://buymeacoffee.com/gorj','_blank');
}

// ── TOAST ──────────────────────────────────────────────────────────
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// ── CONFETTI ───────────────────────────────────────────────────────
function confetti(n){
  const cols=['#6C47FF','#1DB87A','#D4A843','#E84B6A','#3B6EF8','#F59E0B'];
  for(let i=0;i<n;i++)setTimeout(()=>{
    const el=document.createElement('div');el.className='conf';
    el.style.cssText=`left:${Math.random()*100}vw;top:-10px;background:${cols[Math.floor(Math.random()*cols.length)]};
      width:${5+Math.random()*7}px;height:${5+Math.random()*7}px;border-radius:${Math.random()>.5?'50%':'2px'};
      animation-delay:${Math.random()*0.5}s;animation-duration:${1.8+Math.random()*1.5}s`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),3500);
  },i*40);
}

// ── RESIZE ─────────────────────────────────────────────────────────
window.addEventListener('resize',()=>{render();});

init();
</script>
</body>
</html>
